name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos_version:
        description: "macOS runner version"
        required: false
        default: "macos-15"
        type: choice
        options:
          - macos-14
          - macos-15
      test_destination:
        description: "Xcode destination string for tests"
        required: false
        default: "platform=iOS Simulator,name=iPhone 16 Pro,OS=latest"

jobs:
  build-and-test:
    runs-on: ${{ inputs.macos_version || 'macos-15' }}

    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Print Xcode version
        run: xcodebuild -version

      - name: List available iPhone simulators
        run: xcrun simctl list devices available | grep "iPhone"

      - name: Install dependencies
        run: bundle install

      - name: Run CI pipeline
        env:
          TEST_DESTINATION: ${{ inputs.test_destination || 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' }}
        run: bundle exec fastlane ci
